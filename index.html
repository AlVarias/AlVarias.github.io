            setApiError('');
            setAnalysisResult(null);

            const apiKey = ""; 
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const profileContext = {
              name: PERSONAL_INFO.name,
              about: PERSONAL_INFO.about,
              skills: SKILLS.map(s => s.category + ": " + s.items.join(", ")),
              experience: EXPERIENCE.map(e => `${e.role} at ${e.company}. Highlights: ${e.achievements.join(" ")}`),
              projects: PROJECTS.map(p => `${p.title}: ${p.description}`)

            const systemInstruction = `You are an AI recruiter assistant helping evaluate Allen Albert T. Varias's fit for job descriptions. 
            Here is Allen's resume context: ${JSON.stringify(profileContext)}. 
            Analyze the provided job description and evaluate how well Allen's specific Linux, OpenStack, Infrastructure, and Automation experience matches it. Be objective, professional, and highlight specific overlaps. Provide your response strictly adhering to the JSON schema.`;

            const payload = {
              systemInstruction: { parts: [{ text: systemInstruction }] },
              contents: [{ parts: [{ text: `Job Description:\n${jobDescInput}` }] }],
              generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                  type: "OBJECT",
                  properties: {
                    matchPercentage: { type: "INTEGER", description: "Estimated fit percentage (0-100)" },
                    summary: { type: "STRING", description: "A 2-3 sentence summary of why Allen is a good fit for this role." },
                    keyStrengths: {
                      type: "ARRAY",
                      items: { type: "STRING" },
                      description: "3-4 bullet points specifically mapping Allen's past projects/skills to the job requirements."
                    }
                  },
                  required: ["matchPercentage", "summary", "keyStrengths"]
                }
              }
            };

            const fetchWithRetry = async (retries = 5) => {
              const delays = [1000, 2000, 4000, 8000, 16000];
              for (let i = 0; i < retries; i++) {
                try {
                  const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                  });
                  if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                  return await response.json();
                } catch (err) {
                  if (i === retries - 1) throw err;
                  await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
              }
            };

            try {
              if(!apiKey) throw new Error("API Key Missing! Please add your Gemini API Key in the code.");
              const data = await fetchWithRetry();
              const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
              if (resultText) {
                setAnalysisResult(JSON.parse(resultText));
              } else {
                throw new Error("Invalid response from AI.");
              }
            } catch (err) {
              setApiError(err.message === "API Key Missing! Please add your Gemini API Key in the code." ? err.message : "Sorry, the AI is currently unavailable to analyze this job description. Please try again later.");

                          </div>
                          <h3 className="text-lg font-bold text-slate-200 mb-2 flex items-center justify-center gap-2">
                            {interest.title}
                            {interest.link && <ExternalLinkIcon className="w-4 h-4 text-slate-500" />}
                          </h3>
                          <p className="text-sm text-slate-400 leading-relaxed">{interest.description}</p>
                        </React.Fragment>
                      );
                      
                      const containerClasses = "bg-slate-800/30 rounded-2xl p-6 border border-slate-700/50 hover:border-blue-500/30 transition-all duration-300 hover:-translate-y-1 text-center flex flex-col items-center block w-full";

                      return interest.link ? (
                        <a key={idx} href={interest.link} target="_blank" rel="noopener noreferrer" className={containerClasses + " cursor-pointer group"}>
                          {innerContent}
                        </a>
                      ) : (
                        <div key={idx} className={containerClasses}>
                          {innerContent}
                        </div>
                      );
                    })}
                  </div>
                </section>

                <section id="contact" className="py-32 border-t border-slate-800/50 text-center max-w-2xl mx-auto">
                  <p className="text-blue-400 font-mono mb-4">What's Next?</p>
                  <h2 className="text-4xl md:text-5xl font-bold text-slate-100 mb-6">Get In Touch</h2>
                  <p className="text-slate-400 text-lg mb-10 leading-relaxed">I'm currently looking for new opportunities to architect scalable systems and tackle complex infrastructure challenges. Whether you have a question or just want to say hi, I'll try my best to get back to you!</p>
                  
                  <div className="flex flex-wrap justify-center gap-4">
                    <a href={`mailto:${PERSONAL_INFO.email}`} className="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-lg font-medium transition-colors text-lg">
                      <MailIcon className="w-5 h-5" /> Say Hello
                    </a>
                    <a href={PERSONAL_INFO.digitalCardLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-8 py-4 rounded-lg font-medium transition-colors text-lg shadow-[0_0_15px_rgba(59,130,246,0.15)] hover:shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                      <IdCardIcon className="w-5 h-5" /> View Digital Card
                    </a>
                  </div>
                </section>
              </main>

              <footer className="py-8 text-center text-slate-500 border-t border-slate-800">
                <div className="flex justify-center gap-6 mb-4">
                  <a href={PERSONAL_INFO.github} target="_blank" rel="noopener noreferrer" className="hover:text-blue-400 transition-colors"><GithubIcon className="w-5 h-5" /></a>
                  <a href={PERSONAL_INFO.linkedin} target="_blank" rel="noopener noreferrer" className="hover:text-blue-400 transition-colors"><LinkedinIcon className="w-5 h-5" /></a>
                  <a href={`mailto:${PERSONAL_INFO.email}`} className="hover:text-blue-400 transition-colors"><MailIcon className="w-5 h-5" /></a>
                </div>
                <p className="text-sm font-mono">Designed and built for Allen Albert T. Varias</p>
              </footer>

              {/* PROJECT ARTICLE VIEW MODAL */}
              {selectedProject && (
                <div 
                  className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm overflow-y-auto"
                  onClick={() => setSelectedProject(null)}
                >
                  <div 
                    className="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl animate-in my-auto"
                    onClick={(e) => e.stopPropagation()}
                  >
                    <div className="flex items-center justify-between p-6 border-b border-slate-800 bg-slate-900 sticky top-0 z-10">
                      <div className="flex items-center gap-3">
                        <div className="p-2 bg-blue-500/10 rounded-lg"><ServerIcon className="w-6 h-6 text-blue-400" /></div>
                        <div>
                          <h3 className="text-xl font-bold text-slate-100">{selectedProject.title}</h3>
                          <p className="text-sm text-blue-400 font-mono">{selectedProject.article?.role}</p>
                        </div>
                      </div>
                      <button onClick={() => setSelectedProject(null)} className="text-slate-400 hover:text-white transition-colors"><XIcon className="w-6 h-6" /></button>
                    </div>
                    <div className="p-6 overflow-y-auto flex-1 space-y-6">
                      {/* Private Disclaimer */}
                      {selectedProject.article?.isPrivateCaseStudy && (
                        <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 flex items-start gap-3 text-amber-300 text-sm">
                          <ShieldAlertIcon className="w-5 h-5 shrink-0 mt-0.5 text-amber-400" />
                          <div>
                            <span className="font-bold">Private Material Notice:</span> {selectedProject.article.disclaimer}
                          </div>
                        </div>
                      )}

                      <div className="flex flex-wrap gap-2">
                        {selectedProject.techStack.map((tech, i) => (
                          <span key={i} className="text-xs font-mono text-emerald-400 bg-emerald-400/10 px-3 py-1 rounded-full">{tech}</span>
                        ))}
                      </div>

                      <div>
                        <h4 className="text-lg font-semibold text-slate-100 mb-2 border-b border-slate-800 pb-2">Project Overview</h4>
                        <p className="text-slate-300 leading-relaxed">{selectedProject.article?.overview || selectedProject.description}</p>
                      </div>

                      {selectedProject.article?.subProjects && (
                        <div className="space-y-6 pt-4 border-t border-slate-800">
                          <div className="flex items-center justify-between">
                            <h4 className="text-xl font-bold text-slate-100">Featured Web Applications & Live Previews</h4>
                            <span className="text-xs font-mono text-blue-400 bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20">
                              {selectedProject.article.subProjects.length} Live Sites
                            </span>
                          </div>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {selectedProject.article.subProjects.map((sub, idx) => (
                              <div key={idx} className="bg-slate-800/50 border border-slate-700/80 rounded-xl overflow-hidden flex flex-col hover:border-blue-500/50 transition-all shadow-lg">
                                {/* Browser Preview Bar */}
                                <div className="bg-slate-950 px-3 py-2 border-b border-slate-800 flex items-center justify-between gap-2">
                                  <div className="flex items-center gap-1.5">
                                    <span className="w-2.5 h-2.5 rounded-full bg-red-500/80"></span>
                                    <span className="w-2.5 h-2.5 rounded-full bg-amber-500/80"></span>
                                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500/80"></span>
                                  </div>
                                  <span className="text-[11px] font-mono text-slate-400 truncate max-w-[200px]">{sub.url}</span>
                                  <a 
                                    href={sub.url} 
                                    target="_blank" 
                                    rel="noopener noreferrer" 
                                    className="text-blue-400 hover:text-blue-300 p-1"
                                    title={`Open ${sub.title} in new tab`}
                                  >
                                    <ExternalLinkIcon className="w-3.5 h-3.5" />
                                  </a>
                                </div>
                                {/* Live Embedded Iframe Preview */}
                                <div className="relative h-52 w-full bg-slate-950 overflow-hidden">
                                  <iframe 
                                    src={sub.url} 
                                    title={sub.title}
                                    className="w-[200%] h-[200%] origin-top-left scale-50 border-0 pointer-events-none"
                                    loading="lazy"
                                  />
                                  <a 
                                    href={sub.url} 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="absolute inset-0 bg-slate-950/10 hover:bg-slate-950/40 transition-colors flex items-center justify-center group/overlay"
                                  >
                                    <span className="opacity-0 group-hover/overlay:opacity-100 transition-opacity bg-blue-600 text-white text-xs font-medium px-3 py-1.5 rounded-lg shadow-lg flex items-center gap-1.5">
                                      Interact with Live Site <ExternalLinkIcon className="w-3.5 h-3.5" />
                                    </span>
                                  </a>
                                </div>
                                {/* Description & Action */}
                                <div className="p-4 flex-1 flex flex-col justify-between space-y-3">
                                  <div>
                                    <div className="flex items-center justify-between gap-2 mb-1">
                                      <h5 className="text-lg font-bold text-slate-100">{sub.title}</h5>
                                      <span className="text-[10px] font-mono text-emerald-400 bg-emerald-400/10 px-2 py-0.5 rounded-full">{sub.tag}</span>
                                    </div>
                                    <p className="text-sm text-slate-300 leading-relaxed">{sub.description}</p>
                                  </div>
                                  <a 
                                    href={sub.url} 
                                    target="_blank" 
                                    rel="noopener noreferrer" 
                                    className="inline-flex items-center justify-center gap-2 w-full bg-slate-900 hover:bg-blue-600 text-blue-400 hover:text-white border border-slate-700 hover:border-blue-500 px-3 py-2 rounded-lg text-xs font-medium transition-colors"
                                  >
                                    <GlobeIcon className="w-3.5 h-3.5" /> Visit {sub.title}
                                  </a>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* Image Gallery & Explanation Section */}
                      {selectedProject.article?.images && (
                        <div className="space-y-8 pt-4 border-t border-slate-800">
                          <h4 className="text-xl font-bold text-slate-100">Project Diagrams & Technical Screenshots</h4>
                          <div className="grid grid-cols-1 gap-8">
                            {selectedProject.article.images.map((img, index) => (
                              <div key={index} className="bg-slate-800/40 border border-slate-700/60 rounded-xl p-4 sm:p-6 space-y-4">
                                <h5 className="text-md font-semibold text-blue-400">{img.title}</h5>
                                <div className="rounded-lg overflow-hidden border border-slate-700 bg-slate-950 flex items-center justify-center p-2">
                                  {img.isVideo ? (
                                    <video src={img.url} controls className="max-h-[450px] w-auto rounded shadow-lg" />
                                  ) : (
                                    <img src={img.url} alt={img.title} className="max-h-[450px] w-auto object-contain rounded" />
                                  )}
                                </div>
                                <p className="text-sm text-slate-300 leading-relaxed bg-slate-900/60 p-3 rounded-lg border border-slate-800">
                                  <span className="font-bold text-emerald-400">Technical Breakdown: </span>{img.caption}
                                </p>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {selectedProject.article?.details && (
                        <div className="pt-4 border-t border-slate-800">
                          <h4 className="text-lg font-semibold text-slate-100 mb-3 border-b border-slate-800 pb-2">Key Contributions & Implementation</h4>
                          <ul className="space-y-3">
                            {selectedProject.article.details.map((item, idx) => (
                              <li key={idx} className="flex items-start gap-3 text-slate-300">
                                <ChevronRightIcon className="w-5 h-5 text-emerald-500 shrink-0 mt-0.5" />
                                <span>{item}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      )}

                      <div className="flex flex-wrap items-center justify-between gap-4 pt-6 border-t border-slate-800">
                        <div className="flex gap-3">
                          {selectedProject.github && (
                            <a href={selectedProject.github} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                              <GithubIcon className="w-4 h-4" /> GitHub
                            </a>
                          )}
                          {selectedProject.secondaryLink && (
                            <a href={selectedProject.secondaryLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                              <GlobeIcon className="w-4 h-4" /> {selectedProject.article?.secondaryExternalLabel || "Read News Article"}
                            </a>
                          )}
                          {selectedProject.link && selectedProject.link !== "#" && (
                            <a href={selectedProject.link} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                              <ExternalLinkIcon className="w-4 h-4" /> Open Project Link
                            </a>
                          )}
                        </div>
                        <button onClick={() => setSelectedProject(null)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-5 py-2 rounded-lg text-sm font-medium transition-colors">
                          Close
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* AI MODAL */}
              {isJobFitModalOpen && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
                  <div className="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
                    <div className="flex items-center justify-between p-6 border-b border-slate-800 bg-slate-900">
                      <div className="flex items-center gap-3">
                        <div className="p-2 bg-emerald-500/10 rounded-lg"><SparklesIcon className="w-6 h-6 text-emerald-400" /></div>
                        <h3 className="text-xl font-bold text-slate-100">AI Job Fit Analyzer</h3>
                      </div>
                      <button onClick={() => setIsJobFitModalOpen(false)} className="text-slate-400 hover:text-white transition-colors"><XIcon className="w-6 h-6" /></button>
                    </div>
                    <div className="p-6 overflow-y-auto flex-1">
                      {!analysisResult ? (
                        <>
                          <p className="text-slate-300 mb-4">Paste a job description below, and my AI assistant will analyze my resume data to tell you why I'm a great fit for your role!</p>
                          <textarea value={jobDescInput} onChange={(e) => setJobDescInput(e.target.value)} placeholder="Paste job description here..." className="w-full h-48 bg-slate-800 border border-slate-700 rounded-lg p-4 text-slate-200 placeholder:text-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all resize-none mb-4" />
                          {apiError && <p className="text-red-400 mb-4 text-sm">{apiError}</p>}
                          <button onClick={handleAnalyzeJobFit} disabled={isAnalyzing || !jobDescInput.trim()} className="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-700 disabled:text-slate-400 text-white px-6 py-3 rounded-lg font-medium transition-colors flex justify-center items-center gap-2">
                            {isAnalyzing ? <><Loader2Icon className="w-5 h-5 animate-spin" /> Analyzing Fit...</> : <><SparklesIcon className="w-5 h-5" /> Analyze Fit</>}
                          </button>
                        </>
                      ) : (
                        <div className="space-y-6 animate-in">
                          <div className="flex flex-col items-center justify-center p-6 bg-slate-800/50 rounded-xl border border-slate-700 text-center">
                            <div className="text-5xl font-bold text-emerald-400 mb-2">{analysisResult.matchPercentage}%</div>
                            <div className="text-slate-300 font-medium tracking-wide uppercase text-sm">Match Score</div>
                          </div>
                          <div>
                            <h4 className="text-lg font-semibold text-slate-100 mb-2 border-b border-slate-800 pb-2">Summary</h4>
                            <p className="text-slate-300 leading-relaxed">{analysisResult.summary}</p>
                          </div>
                          <div>
                            <h4 className="text-lg font-semibold text-slate-100 mb-3 border-b border-slate-800 pb-2">Key Strengths for this Role</h4>
                            <ul className="space-y-3">
                              {analysisResult.keyStrengths.map((strength, idx) => (
                                <li key={idx} className="flex items-start gap-3 text-slate-300"><ChevronRightIcon className="w-5 h-5 text-emerald-500 shrink-0 mt-0.5" /><span>{strength}</span></li>
                              ))}
                            </ul>
                          </div>
                          <button onClick={() => { setAnalysisResult(null); setJobDescInput(''); }} className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-6 py-3 rounded-lg font-medium transition-colors mt-6">Analyze Another Role</button>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
